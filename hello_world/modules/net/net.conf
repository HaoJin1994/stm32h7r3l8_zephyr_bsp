# General config

CONFIG_MAIN_STACK_SIZE=1200
CONFIG_POSIX_API=y



# Networking config
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y

# Network driver config
CONFIG_TEST_RANDOM_GENERATOR=y

# Network address config
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.0.11"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.0.12"
CONFIG_MDIO_SHELL=y
CONFIG_NET_SHELL=y



