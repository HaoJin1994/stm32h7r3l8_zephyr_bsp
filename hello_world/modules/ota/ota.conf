# ---------------------------------------------------------------------------
# RAM_LOAD 模式下让 MCUmgr 的 image 组可用的完整依赖链：
#
#   MCUMGR_GRP_IMG
#     depends on IMG_MANAGER
#   IMG_MANAGER                              (zephyr/subsys/dfu/Kconfig:10)
#     depends on STREAM_FLASH
#     depends on !MCUBOOT_BOOTLOADER_MODE_RAM_LOAD
#                 || RETENTION_BOOTLOADER_INFO_OUTPUT_FUNCTION   <-- 关键
#   RETENTION_BOOTLOADER_INFO_OUTPUT_FUNCTION
#     default y，在 menuconfig RETENTION_BOOTLOADER_INFO 内
#   RETENTION
#     depends on RETAINED_MEM
#     depends on DT_HAS_ZEPHYR_RETENTION_ENABLED   <-- 需要 ota.overlay 里的节点
#
# 对应 MCUboot 侧配置见 sysbuild/mcuboot.conf（BOOT_SHARE_DATA 等）。
# ---------------------------------------------------------------------------
CONFIG_RETAINED_MEM=y #启用RETAINED内存驱动
CONFIG_RETENTION=y #启用 Retention 系统
CONFIG_RETENTION_BOOTLOADER_INFO=y
CONFIG_RETENTION_BOOTLOADER_INFO_TYPE_MCUBOOT=y

CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y

# 出错时回 "rsn" 文字说明，调试期很有用
CONFIG_MCUMGR_GRP_IMG_VERBOSE_ERR=y

# ---------------------------------------------------------------------------
# MCUmgr 传输层
# ---------------------------------------------------------------------------
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_TASKSTAT=y
CONFIG_MCUMGR_TRANSPORT_UDP=y

CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_CRC=y

# 自建 TCP OTA需要 sys_reboot()
#CONFIG_REBOOT=y

CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="1.0.1"
