# 基础
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

# MCUboot 在内部 Flash
CONFIG_FLASH_SIZE=64

# Flash 驱动
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_STM32_XSPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096



CONFIG_RETAINED_MEM=y #启用RETAINED内存驱动
CONFIG_RETENTION=y #启用 Retention 系统
CONFIG_BOOT_SHARE_DATA=y #启用共享数据
CONFIG_BOOT_SHARE_DATA_BOOTINFO=y #启用引导信息共享数据类型
CONFIG_BOOT_SHARE_BACKEND_RETENTION=y #使用 retention/blinfo 子系统存储共享数据

