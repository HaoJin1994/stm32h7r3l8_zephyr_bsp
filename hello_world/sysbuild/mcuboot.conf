# 基础
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y

# MCUboot 在内部 Flash
#CONFIG_FLASH_BASE_ADDRESS=0x08000000
CONFIG_FLASH_SIZE=64

# XIP 模式（依赖设备树里有 XSPI NOR 节点）
#CONFIG_XIP=y
#CONFIG_BOOT_DIRECT_XIP=y


# Flash 驱动
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_STM32_XSPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

#CONFIG_FLASH_STM32_NOR_MEMMAP=y


